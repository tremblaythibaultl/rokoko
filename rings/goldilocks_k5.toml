# Z_p[X]/(X^96 - X^48 + 1), the cyclotomic ring of conductor 9 * 2^5 = 288, over Goldilocks:
# 32 cubic slots F_p[X]/(X^3 - eta_j). See docs/goldilocks-port.md.
family = "trinomial"
degree = 96
mod_q = 18446744069414584321 # 2^64 - 2^32 + 1
# The smallest tau with 2^128 challenges and invertible differences (Finding 6), then the
# smallest bound on ||sigma(c)||_inf that keeps 2^128 after rejection, as for rings/*_d4.toml.
tau = 39 # C(96,39) * 2^39 = 2^128.95 challenges before rejection; Pr[non-invertible difference] in [2^-139.3, 2^-115.0]
op_norm_bound = 13.0 # about 1.90 sampling attempts per challenge, 2^128.03 after rejection; gamma_C = sqrt(3) * 13.0 = 22.5
